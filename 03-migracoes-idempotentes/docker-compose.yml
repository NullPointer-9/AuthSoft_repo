name: migracoes

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: migracoes-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      # Para tools/verificar-idempotencia.ps1 rodar os scripts direto no banco.
      - ./scripts:/migracoes:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Só cria o banco vazio. Tabelas são responsabilidade do migrador.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: migracoes-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_HOST: sqlserver
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  postgres:
    image: postgres:16
    container_name: migracoes-postgres
    environment:
      POSTGRES_DB: migracoes_demo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-54333}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts:/migracoes:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d migracoes_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sqlserver-data:
  postgres-data:
