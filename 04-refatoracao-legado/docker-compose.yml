name: legado

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legado-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT:-14334}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Roda os scripts de database/ em ordem e encerra. Todos são idempotentes,
  # então subir de novo não duplica nada.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legado-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_HOST: sqlserver
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

volumes:
  sqlserver-data:
